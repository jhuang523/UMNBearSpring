#will contain recharge, initial conditions, boundary conditions 

network_dir: 'networks/anastomotic_low_slope'
inflow_type : 'timeseries'  # 'constant', 'timeseries', 'ramp'
recharge_file: 'input_data/recharge_m_s/gaussian_pulse_high_flow.csv'
recharge_distribution: ['partitioned'] # 'partitioned', 'diffuse', 'point'
head_boundary_type : 'constant'  # 'constant', 'timeseries', 'ramp' 
head_boundary: 0.01
spin_up : True
initial_conditions_file : 'input_data/init_conditions/high_flow/anastomotic_low_slope_IC.pkl'  # file containing initial flowrate and water depth info
baseflow: 0.2 #m3/s
adaptive_timesteps: True 
dt_max: 100
t_max: 2160000  # fix so that if None, it tries the max timeseries or a default value
t_ss_max: 864000
Q_tol: .03
h_tol: 0.03
hydrograph_output_path: 'output/hydrographs_df'
hydrograph_method: 'dataframe'