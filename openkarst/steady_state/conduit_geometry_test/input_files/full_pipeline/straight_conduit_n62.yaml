#will contain recharge, initial conditions, boundary conditions 

network_dir: 'networks/straight_conduit_n62'
inflow_type : 'timeseries'  # 'constant', 'timeseries', 'ramp'
recharge_file: 'input_data/recharge_m_s/gaussian_pulse.csv'
recharge_distribution: ['parititioned', 'diffuse']  # 'gaussian', 'diffuse', 'point'
head_boundary_type : 'constant'  # 'constant', 'timeseries', 'ramp' 
head_boundary: 0.01
spin_up : True
initial_conditions_file : 'input_data/init_conditions/straight_conduit_n62_IC.pkl'  # file containing initial flowrate and water depth info
baseflow: 0.02 #m3/s
adaptive_timesteps: True 
dt_max: 100
t_max: 2160000  # fix so that if None, it tries the max timeseries or a default value
t_ss_max: 864000
Q_tol: .01
h_tol: 0.03
hydrograph_output_path: 'output/hydrographs'